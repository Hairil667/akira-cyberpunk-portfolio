<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="50%" stop-color="#13141f"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="armorHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Aura Grid -->
  <g opacity="0.3" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 4">
    <circle cx="400" cy="450" r="360" fill="none" />
    <circle cx="400" cy="450" r="280" fill="none" />
    <circle cx="400" cy="450" r="180" fill="none" />
    <line x1="400" y1="50" x2="400" y2="850" />
    <line x1="50" y1="450" x2="750" y2="450" />
    <line x1="150" y1="150" x2="650" y2="750" />
    <line x1="150" y1="750" x2="650" y2="150" />
  </g>

  <!-- Wing Thrusters / Shoulder Binders -->
  <g id="thrusters">
    <!-- Left Wing -->
    <polygon points="260,240 120,160 80,340 180,420 250,340" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="130,190 95,330 170,390" fill="url(#armorHighlight)"/>
    <line x1="90" y1="240" x2="160" y2="280" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
    <line x1="85" y1="260" x2="150" y2="300" stroke="#00f0ff" stroke-width="2"/>
    <!-- Exhaust Ports L -->
    <rect x="110" y="320" width="30" height="8" transform="rotate(-30 110 320)" fill="#00f0ff" filter="url(#glow)"/>
    <rect x="130" y="350" width="30" height="8" transform="rotate(-30 130 350)" fill="#00f0ff" filter="url(#glow)"/>

    <!-- Right Wing -->
    <polygon points="540,240 680,160 720,340 620,420 550,340" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="670,190 705,330 630,390" fill="url(#armorHighlight)"/>
    <line x1="710" y1="240" x2="640" y2="280" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
    <line x1="715" y1="260" x2="650" y2="300" stroke="#00f0ff" stroke-width="2"/>
    <!-- Exhaust Ports R -->
    <rect x="660" y="320" width="30" height="8" transform="rotate(30 660 320)" fill="#00f0ff" filter="url(#glow)"/>
    <rect x="640" y="350" width="30" height="8" transform="rotate(30 640 350)" fill="#00f0ff" filter="url(#glow)"/>
  </g>

  <!-- Heavy Torso Frame -->
  <g id="torso">
    <!-- Spine / Core Base -->
    <polygon points="340,190 460,190 490,320 450,470 350,470 310,320" fill="url(#metalDark)" stroke="#475569" stroke-width="3"/>
    
    <!-- Chest Armor Plates (Gold Cyber) -->
    <polygon points="330,220 400,200 400,340 320,310" fill="url(#goldGrad)" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>
    <polygon points="470,220 400,200 400,340 480,310" fill="url(#goldGrad)" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Reactor Core Arc (Glowing Cyan / Gold) -->
    <circle cx="400" cy="275" r="32" fill="#0b0f19" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="400" cy="275" r="22" fill="#00f0ff" filter="url(#glow)" opacity="0.9"/>
    <polygon points="400,258 415,285 385,285" fill="#ffffff"/>
    
    <!-- Abdomen & Hydraulic Pistons -->
    <rect x="365" y="355" width="16" height="75" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="419" y="355" width="16" height="75" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="388" y="350" width="24" height="90" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <line x1="390" y1="370" x2="410" y2="370" stroke="#00f0ff" stroke-width="2"/>
    <line x1="390" y1="390" x2="410" y2="390" stroke="#00f0ff" stroke-width="2"/>
    <line x1="390" y1="410" x2="410" y2="410" stroke="#00f0ff" stroke-width="2"/>

    <!-- Waist Armor Tassets -->
    <polygon points="340,460 460,460 480,540 400,580 320,540" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="380,480 420,480 415,550 385,550" fill="url(#goldGrad)"/>
  </g>

  <!-- Mecha Head & V-Fin Antenna -->
  <g id="head">
    <!-- V-Fin Antennas (Gold Samurai Crest) -->
    <polygon points="400,145 280,60 320,95 385,140" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" filter="url(#glow)"/>
    <polygon points="400,145 520,60 480,95 415,140" fill="url(#goldGrad)" stroke="#fff" stroke-width="1" filter="url(#glow)"/>
    <polygon points="400,130 360,50 380,90 400,105" fill="#fbbf24"/>
    <polygon points="400,130 440,50 420,90 400,105" fill="#fbbf24"/>
    
    <!-- Central Head Gem & Crest -->
    <polygon points="400,105 415,135 400,150 385,135" fill="#ff0055" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Helmet Main Structure -->
    <polygon points="365,130 435,130 450,185 400,215 350,185" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    
    <!-- Visor / Eyes (Twin Glowing Cyan Laser Eyes) -->
    <polygon points="370,165 394,168 392,175 372,173" fill="#00f0ff" filter="url(#glow)"/>
    <polygon points="430,165 406,168 408,175 428,173" fill="#00f0ff" filter="url(#glow)"/>
    <!-- Faceplate Mask -->
    <polygon points="385,180 415,180 410,205 390,205" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="392" y1="188" x2="408" y2="188" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="394" y1="196" x2="406" y2="196" stroke="#00f0ff" stroke-width="1.5"/>
  </g>

  <!-- Shoulders & Arms -->
  <g id="arms">
    <!-- Left Shoulder Pauldron -->
    <polygon points="320,200 220,180 180,260 270,300 320,260" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="210,200 170,255 230,285" fill="url(#goldGrad)"/>
    <text x="215" y="245" fill="#0a0a10" font-family="'Courier New', monospace" font-weight="900" font-size="16" transform="rotate(15 215 245)">RX-09</text>
    <!-- Left Arm -->
    <polygon points="250,300 200,320 220,440 270,410" fill="url(#metalDark)" stroke="#64748b" stroke-width="2"/>
    <polygon points="215,430 180,560 240,580 270,460" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Left Hand Gauntlet & Blade Mount -->
    <polygon points="180,560 160,630 200,660 235,590" fill="url(#goldGrad)" stroke="#fff" stroke-width="1.5"/>

    <!-- Right Shoulder Pauldron -->
    <polygon points="480,200 580,180 620,260 530,300 480,260" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="590,200 630,255 570,285" fill="url(#goldGrad)"/>
    <text x="560" y="255" fill="#0a0a10" font-family="'Courier New', monospace" font-weight="900" font-size="16" transform="rotate(-15 560 255)">AKIRA</text>
    <!-- Right Arm -->
    <polygon points="550,300 600,320 580,440 530,410" fill="url(#metalDark)" stroke="#64748b" stroke-width="2"/>
    <polygon points="585,430 620,560 560,580 530,460" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Right Hand Gauntlet & Weapon Mount -->
    <polygon points="620,560 640,630 600,660 565,590" fill="url(#goldGrad)" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- High-Frequency Plasma Katana (Held diagonally) -->
  <g id="katana-sheathed-or-drawn">
    <line x1="610" y1="620" x2="740" y2="760" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <line x1="600" y1="610" x2="380" y2="120" stroke="#00f0ff" stroke-width="6" filter="url(#glow)"/>
    <line x1="600" y1="610" x2="380" y2="120" stroke="#ffffff" stroke-width="2"/>
    <polygon points="605,600 625,620 595,635 585,615" fill="url(#goldGrad)" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Legs & Lower Thrusters -->
  <g id="legs">
    <!-- Left Thigh & Knee -->
    <polygon points="340,540 310,650 370,680 390,560" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Left Shin & Foot -->
    <polygon points="310,660 280,820 370,840 380,700" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="290,690 320,680 340,790 300,800" fill="url(#armorHighlight)"/>
    <!-- Left Foot -->
    <polygon points="260,820 370,840 380,870 230,865" fill="url(#goldGrad)" stroke="#fff" stroke-width="2"/>

    <!-- Right Thigh & Knee -->
    <polygon points="460,540 490,650 430,680 410,560" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Right Shin & Foot -->
    <polygon points="490,660 520,820 430,840 420,700" fill="url(#metalDark)" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="510,690 480,680 460,790 500,800" fill="url(#armorHighlight)"/>
    <!-- Right Foot -->
    <polygon points="540,820 430,840 420,870 570,865" fill="url(#goldGrad)" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- HUD Telemetry Overlay -->
  <g id="hud-overlay" font-family="'Courier New', monospace" font-size="12" fill="#00f0ff" opacity="0.85">
    <text x="50" y="80">[ FRAME: RX-09 RONIN ]</text>
    <text x="50" y="105">[ PILOT: AKIRA ]</text>
    <text x="50" y="130">[ SYNC RATE: 99.84% ]</text>
    <text x="50" y="155">[ REACTOR: HYPER-GOLD CORE ]</text>
    
    <text x="570" y="80">[ STATUS: COMBAT READY ]</text>
    <text x="570" y="105">[ THREAT LEVEL: MAXIMUM ]</text>
    <text x="570" y="130">[ ARMOR INTEGRITY: 100% ]</text>
    <text x="570" y="155">[ WEAPON: PLASMA KATANA ]</text>
    
    <!-- Target Brackets -->
    <path d="M 320 220 L 300 220 L 300 250" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M 480 220 L 500 220 L 500 250" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M 320 340 L 300 340 L 300 310" stroke="#00f0ff" stroke-width="2" fill="none"/>
    <path d="M 480 340 L 500 340 L 500 310" stroke="#00f0ff" stroke-width="2" fill="none"/>
  </g>
</svg>
